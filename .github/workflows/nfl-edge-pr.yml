name: NFL Edge PR checks

on:
  pull_request:
    paths:
      - "nfl-edge/**"
      - "docs/weekly-forward-shadow-report-spec.md"
      - ".github/workflows/collect-odds.yml"
      - ".github/workflows/nfl-edge-pr.yml"

permissions:
  contents: read

jobs:
  focused-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: nfl-edge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Collector schedule guardrails
        working-directory: .
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          workflow = Path('.github/workflows/collect-odds.yml').read_text()
          schedules = re.findall(r"- cron: '([^']+)'", workflow)
          approved = ['0 * * * *']
          retired = {
              '2-59/5 * * * *',
              '58 16 * * 6', '58 13 * * 0', '28 15 * * 0', '53 16 * * 0',
              '23 20 * * 6', '23 17 * * 0', '53 18 * * 0', '18 20 * * 0',
              '18 0 * * 0', '18 21 * * 0', '48 22 * * 0', '13 0 * * 1',
              '13 21 * * 1', '43 22 * * 1', '8 0 * * 2',
          }
          assert schedules == approved, f'unexpected collector schedules: {schedules}'
          assert len(schedules) == len(set(schedules)), 'duplicate collector cron entry'
          present = sorted(retired.intersection(schedules))
          assert not present, f'retired collector schedules restored: {present}'
          PY
      - name: Pick, checkpoint and migration regressions
        run: python -m unittest tests.test_picks tests.test_checkpoints tests.test_migrations -v
      - name: Weekly health contract
        run: node --test tests/report-health.test.mjs
      - name: Sunday board fail-closed verdict
        run: node --test tests/sunday-board.test.mjs
