name: sync-historical-outcomes

on:
  workflow_dispatch:
    inputs:
      seasons:
        description: Comma-separated seasons
        required: true
        default: '2022,2023,2024'

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Read NFL Edge source without resolving unrelated submodules
        env:
          GH_READ_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'BOOTSTRAP'
          import io, os, pathlib, tarfile, urllib.request
          url = 'https://api.github.com/repos/' + os.environ['GITHUB_REPOSITORY'] + '/tarball/' + os.environ['GITHUB_SHA']
          req = urllib.request.Request(url, headers={'Authorization': 'Bearer ' + os.environ['GH_READ_TOKEN'], 'Accept': 'application/vnd.github+json'})
          data = urllib.request.urlopen(req, timeout=60).read()
          with tarfile.open(fileobj=io.BytesIO(data), mode='r:gz') as archive:
            for member in archive:
              relative = pathlib.PurePosixPath(*pathlib.PurePosixPath(member.name).parts[1:])
              if member.isfile() and relative.parts and relative.parts[0] == 'nfl-edge' and '..' not in relative.parts:
                target = pathlib.Path(str(relative)); target.parent.mkdir(parents=True, exist_ok=True)
                target.write_bytes(archive.extractfile(member).read())
          BOOTSTRAP
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r nfl-edge/ops/requirements.txt
      - name: Verify parser tests
        working-directory: nfl-edge
        run: python -m unittest -v tests/test_historical_outcomes.py
      - name: Import immutable settled outcomes
        working-directory: nfl-edge
        env:
          NFL_EDGE_DATABASE_URL: ${{ secrets.NFL_EDGE_DATABASE_URL }}
        run: python ops/historical_outcomes.py --seasons "${{ inputs.seasons }}"
