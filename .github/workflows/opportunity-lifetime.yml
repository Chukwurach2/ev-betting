name: opportunity-lifetime

# Read-only analysis of the Saturday timing experiment. Zero API credits.
# Reads ONLY the dedicated timing tables (ncaaf_timing_quotes /
# ncaaf_timing_runs / ncaaf_timing_book_states) -- never the live
# odds-quotes table. Run after the 2026-09-19 collection completes.

on:
  workflow_dispatch:
    inputs:
      experiment:
        description: "Experiment key in the timing tables"
        required: false
        default: "saturday-timing"

jobs:
  lifetime:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          sparse-checkout: nfl-edge
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r nfl-edge/ops/requirements.txt
      - name: Measure opportunity lifetime (read-only, zero credits)
        env:
          NFL_EDGE_DATABASE_URL: ${{ secrets.NFL_EDGE_DATABASE_URL }}
        run: |
          python nfl-edge/ops/opportunity_lifetime.py \
            --experiment "${{ inputs.experiment }}" \
            --out /tmp/saturday_timing_analysis.json
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opportunity-lifetime-${{ github.run_number }}
          path: /tmp/saturday_timing_analysis.json
