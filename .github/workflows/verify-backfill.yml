name: verify-backfill
on:
  workflow_dispatch:
    inputs:
      since:
        description: "Only verify snapshots with requested_at >= this date (YYYY-MM-DD). Empty = all."
        required: false
        default: ""
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Read NFL Edge source without resolving unrelated submodules
        uses: actions/checkout@v4
        with:
          sparse-checkout: nfl-edge
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r nfl-edge/ops/requirements.txt
      - name: Verify backfill integrity
        env:
          NFL_EDGE_DATABASE_URL: ${{ secrets.NFL_EDGE_DATABASE_URL }}
        run: |
          if [ -z "${{ inputs.since }}" ]; then
            python nfl-edge/ops/verify_backfill.py
          else
            python nfl-edge/ops/verify_backfill.py --since "${{ inputs.since }}"
          fi
