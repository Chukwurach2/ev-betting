name: audit-dataset
on:
  workflow_dispatch:
    inputs:
      sport:
        description: "Sport key: nfl or ncaaf (tables follow ops/sports.py)"
        required: false
        default: "nfl"
      seasons:
        description: "Comma-separated seasons (2022+ only)"
        required: false
        default: "2022,2023,2024"
      weeks:
        description: "Week range, e.g. 1-18 for NFL or 0-14 for NCAAF"
        required: false
        default: "1-18"
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Read NFL Edge source without resolving unrelated submodules
        uses: actions/checkout@v4
        with:
          sparse-checkout: nfl-edge
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r nfl-edge/ops/requirements.txt
      - name: Run dataset integrity audit
        env:
          NFL_EDGE_DATABASE_URL: ${{ secrets.NFL_EDGE_DATABASE_URL }}
        run: |
          # Capture the audit exit code first, then always print the report,
          # and fail the step at the end if the audit failed (never mask it).
          python nfl-edge/ops/audit_dataset.py \
            --sport "${{ inputs.sport }}" \
            --seasons "${{ inputs.seasons }}" \
            --weeks "${{ inputs.weeks }}" \
            --out /tmp/dataset_audit.json \
            --markdown /tmp/dataset_audit.md
          AUDIT_STATUS=$?
          echo "=== JSON (errors/warnings) ==="
          python -c "import json; r=json.load(open('/tmp/dataset_audit.json')); print('status:', r['status']); [print('E:', e[:200]) for e in r['errors']]; [print('W:', w[:160]) for w in r['warnings'][:10]]"
          cat /tmp/dataset_audit.md
          if [ "$AUDIT_STATUS" -ne 0 ]; then
            echo "audit failed with exit code $AUDIT_STATUS"
          fi
          exit "$AUDIT_STATUS"
      - name: Upload audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dataset-audit
          path: |
            /tmp/dataset_audit.json
            /tmp/dataset_audit.md
