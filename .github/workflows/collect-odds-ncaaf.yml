name: NCAAF Edge odds checkpoint collector
on:
  schedule:
    # Same 15-minute cadence as the NFL collector, but offset by 7 minutes
    # (:07/:22/:37/:52 vs NFL's :00/:15/:30/:45) so the two collectors never
    # fire simultaneously against the shared DB and provider quota.
    # Checkpoint windows are 90 minutes wide (deadline = target + 90m, capped
    # before kickoff), so the worker must run at least that often. Runs with
    # no due checkpoints spend zero provider credits: only the free events
    # endpoint is consulted, and only a due checkpoint triggers a paid odds
    # fetch.
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ncaaf-edge-collect-odds
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # DESIGN (quota): one NCAAF event fetch costs markets x regions =
      # spreads,totals x us = 2 credits (verified 2026-09-13 on the live
      # americanfootball_ncaaf feed). The worker caps at 8 paid requests
      # per run, so a run costs at most 16 credits; runs with no due
      # checkpoints cost 0 (free events feed only). A full 57-game week at
      # ~4-5 windows each is at most ~500 credits, realistically less:
      # missed/unavailable windows spend nothing and each checkpoint is
      # claimed once. Pinnacle is absent from the us-region NCAAF feed, so
      # the book universe is the observed NY-licensed books.
      # QUOTA ISOLATION: the NFL collector has priority on the shared key.
      # When remaining quota drops below NCAAF_EDGE_MIN_QUOTA_REMAINING
      # (default 2000), the NCAAF collector stands down entirely -- free
      # events feed only, zero paid requests -- so a college-slate surge
      # can never cause an NFL T-90/close miss.
      NCAAF_EDGE_REGIONS: us
      NCAAF_EDGE_BOOKMAKERS: draftkings,fanduel,betmgm,betrivers
      NCAAF_EDGE_MIN_QUOTA_REMAINING: 2000
    defaults:
      run:
        working-directory: nfl-edge
    steps:
      - name: Read NFL Edge source without resolving unrelated submodules
        working-directory: .
        env:
          GH_READ_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'BOOTSTRAP'
          import io, os, pathlib, tarfile, urllib.request
          url = 'https://api.github.com/repos/' + os.environ['GITHUB_REPOSITORY'] + '/tarball/' + os.environ['GITHUB_SHA']
          request = urllib.request.Request(url, headers={'Authorization': 'Bearer ' + os.environ['GH_READ_TOKEN'], 'Accept': 'application/vnd.github+json'})
          with urllib.request.urlopen(request, timeout=60) as response:
              data = response.read()
          count = 0
          with tarfile.open(fileobj=io.BytesIO(data), mode='r:gz') as archive:
              for member in archive:
                  relative = pathlib.PurePosixPath(*pathlib.PurePosixPath(member.name).parts[1:])
                  if not member.isfile() or not relative.parts or relative.parts[0] != 'nfl-edge':
                      continue
                  if '..' in relative.parts or relative.is_absolute():
                      raise ValueError('Unsafe archive member')
                  target = pathlib.Path(str(relative))
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(archive.extractfile(member).read())
                  count += 1
          if not count:
              raise ValueError('NFL Edge source missing')
          print('Loaded', count, 'NCAAF-capable source files from the exact workflow commit')
          BOOTSTRAP
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r ops/requirements.txt
      - name: Verify collector secrets
        id: secrets
        env:
          NFL_EDGE_DATABASE_URL: ${{ secrets.NFL_EDGE_DATABASE_URL }}
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
        run: |
          python3 - <<'EOF'
          import os
          if not os.environ.get('NFL_EDGE_DATABASE_URL'):
              print('NFL_EDGE_DATABASE_URL is missing. Add it under GitHub Settings > Secrets and variables > Actions.')
              print('It must be a DIRECT Neon connection (not the pooler): the worker uses a session advisory lock.')
              raise SystemExit(1)
          has_key = bool(os.environ.get('THE_ODDS_API_KEY'))
          print('Collector secrets present' if has_key else 'THE_ODDS_API_KEY missing: migrate/sync will run, odds collection will be skipped')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as fh:
              fh.write(f"has_odds_key={'true' if has_key else 'false'}\n")
          EOF
      - name: Apply additive migrations
        env:
          NFL_EDGE_DATABASE_URL: ${{ secrets.NFL_EDGE_DATABASE_URL }}
        run: python ops/migrate.py
      - name: Sync NCAAF schedule into games table
        env:
          NFL_EDGE_DATABASE_URL: ${{ secrets.NFL_EDGE_DATABASE_URL }}
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
        run: python ops/sync_ncaaf_schedule.py && python ops/heartbeat.py schedule_sync_ncaaf
      - name: Collect due NCAAF checkpoints
        if: steps.secrets.outputs.has_odds_key == 'true'
        env:
          NFL_EDGE_DATABASE_URL: ${{ secrets.NFL_EDGE_DATABASE_URL }}
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
        run: python ops/collect_checkpoints.py --sport ncaaf
      - name: Odds collection skipped (no API key)
        if: steps.secrets.outputs.has_odds_key != 'true'
        run: echo 'Add THE_ODDS_API_KEY as a repo secret to enable checkpoint collection.'
      - name: Verify database state
        env:
          NFL_EDGE_DATABASE_URL: ${{ secrets.NFL_EDGE_DATABASE_URL }}
        run: |
          python3 - <<'EOF'
          import os, psycopg
          conn = psycopg.connect(os.environ["NFL_EDGE_DATABASE_URL"])
          cur = conn.cursor()
          for t in ("games", "ncaaf_edge_checkpoints", "ncaaf_edge_odds_quotes"):
              try:
                  cur.execute(f"SELECT count(*) FROM public.{t}")
                  print(t, "rows:", cur.fetchone()[0])
              except Exception as e:
                  print(t, "MISSING:", str(e).splitlines()[0]); conn.rollback()
          cur.execute("SELECT count(*) FROM public.games WHERE sport='ncaaf'")
          print("ncaaf games:", cur.fetchone()[0])
          cur.execute("SELECT count(*) FROM public.games WHERE sport='nfl'")
          print("nfl games (untouched):", cur.fetchone()[0])
          cur.execute("""SELECT decision_window, count(*) FROM public.ncaaf_edge_checkpoints
                         GROUP BY 1 ORDER BY 1""")
          print("ncaaf checkpoints by type:", cur.fetchall())
          cur.execute("""SELECT status, count(*),
                         sum(jsonb_array_length(quotes)) FROM public.ncaaf_edge_checkpoints
                         GROUP BY 1 ORDER BY 1""")
          print("ncaaf checkpoints by status (count, total quotes):", cur.fetchall())
          conn.close()
          EOF
