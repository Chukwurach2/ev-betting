name: nfl-hd-pull

# H-D CORRECTED minimum viable historical pull, v2 (PAID - user-authorized
# 2026-09-16 14:02 EDT; incremental authorization, hard 700-ADDITIONAL-credit
# ceiling). v1 failed 0/60 on game-day-era event IDs; v2 resolves each game's
# T_dec-active ID via the historical events list at its own T_dec
# (probe-validated method). 47 lookups x 1 + 60 odds calls x 10 = ~647.
# Per-call spend guard aborts in-script rather than breaching 700.
# Read-only on the provider; zero DB writes; zero outcome access.
# Output: immutable pull log artifact (nfl_hd_pull_v2.json).

on:
  workflow_dispatch:

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          sparse-checkout: nfl-edge
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run H-D corrected pull (v2)
        env:
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
        run: python nfl-edge/ops/nfl_hd_pull_v2.py --out /tmp/nfl_hd_pull_v2.json --credit-cap 700
      - name: Upload pull log artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nfl-hd-pull-v2-${{ github.run_number }}
          path: /tmp/nfl_hd_pull_v2.json
