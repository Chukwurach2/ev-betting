name: canonical-identity

on:
  workflow_dispatch:
    inputs:
      sport:
        description: "Sport key"
        required: false
        default: "ncaaf"
      seasons:
        description: "Comma-separated seasons"
        required: false
        default: "2022,2023,2024"

jobs:
  identity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          sparse-checkout: nfl-edge
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r nfl-edge/ops/requirements.txt
      - name: Build canonical identity mapping (read-only)
        env:
          NFL_EDGE_DATABASE_URL: ${{ secrets.NFL_EDGE_DATABASE_URL }}
        run: |
          python nfl-edge/ops/canonical_identity.py \
            --sport "${{ inputs.sport }}" \
            --seasons "${{ inputs.seasons }}" \
            --out /tmp/canonical_identity.json
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: canonical-identity
          path: /tmp/canonical_identity.json
