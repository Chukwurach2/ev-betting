name: nfl-prop-collector

# NFL prospective prop/alternative-market collector (design:
# nfl-edge/docs/nfl-prospective-prop-layer.md).
#
# LIVE (user-authorized 2026-09-16): dispatch-driven runs collect live when
# the repo variable NFL_PROP_LIVE_OK=1 (native schedule removed 2026-09-20
# as redundant with close-watch dispatches). Dispatch with live=false
# remains the dry-run path (full cycle against a RECORDED events-list
# fixture, ZERO /odds calls, ZERO production-table writes). Live paid
# collection requires the dispatch `live` input AND NFL_PROP_LIVE_OK=1.
#
# Per-run credit discipline: NFL_PROP_RUN_CREDIT_CAP (default 90) is checked
# BEFORE any paid call; exceeding it aborts with zero paid calls
# (status aborted_cap).

on:
  # Cost-trim 2026-09-20: native hourly schedule removed. The Hatch prop
  # close-watch crons dispatch this workflow at each game's 6 checkpoints
  # (T-24/T-12/T-6/T-3/T-90m/close), which is where the real coverage lives;
  # the native schedule was redundant with those dispatches. Dispatch with
  # live=true to run live paid collection (ALSO requires
  # NFL_PROP_LIVE_OK=1).
  workflow_dispatch:
    inputs:
      live:
        description: 'Live paid collection (ALSO requires NFL_PROP_LIVE_OK=1)'
        required: false
        default: 'false'
        type: boolean
      trigger_source:
        description: 'Attribution for this dispatch: manual | watchdog | close-watch (schedule events auto-attribute as schedule)'
        required: false
        default: 'manual'
        type: string

permissions:
  contents: read
concurrency:
  group: nfl-prop-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NFL_PROP_REGIONS: us
      # v1 prop books (cost-neutral filter; priced per A1 on markets x regions)
      NFL_PROP_BOOKMAKERS: draftkings,fanduel,betmgm,betrivers,espnbet,williamhill_us,fanatics
      # Trigger attribution: schedule events -> 'schedule'; dispatches use the
      # trigger_source input (watchdog / close-watch stamp their own value).
      NFL_PROP_TRIGGER_SOURCE: ${{ github.event_name == 'schedule' && 'schedule' || inputs.trigger_source }}
    defaults:
      run:
        working-directory: nfl-edge
    steps:
      - name: Read NFL Edge source without resolving unrelated submodules
        working-directory: .
        env:
          GH_READ_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'BOOTSTRAP'
          import io, os, pathlib, tarfile, urllib.request
          url = 'https://api.github.com/repos/' + os.environ['GITHUB_REPOSITORY'] + '/tarball/' + os.environ['GITHUB_SHA']
          request = urllib.request.Request(url, headers={'Authorization': 'Bearer ' + os.environ['GH_READ_TOKEN'], 'Accept': 'application/vnd.github+json'})
          with urllib.request.urlopen(request, timeout=60) as response:
              data = response.read()
          count = 0
          with tarfile.open(fileobj=io.BytesIO(data), mode='r:gz') as archive:
              for member in archive:
                  relative = pathlib.PurePosixPath(*pathlib.PurePosixPath(member.name).parts[1:])
                  if not member.isfile() or not relative.parts or relative.parts[0] != 'nfl-edge':
                      continue
                  if '..' in relative.parts or relative.is_absolute():
                      raise ValueError('Unsafe archive member')
                  target = pathlib.Path(str(relative))
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(archive.extractfile(member).read())
                  count += 1
          if not count:
              raise ValueError('NFL Edge source missing')
          print('Loaded', count, 'NFL Edge source files from the exact workflow commit')
          BOOTSTRAP
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r ops/requirements.txt
      - name: Verify collector secrets
        id: secrets
        env:
          NFL_EDGE_DATABASE_URL: ${{ secrets.NFL_EDGE_DATABASE_URL }}
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
        run: |
          python3 - <<'EOF'
          import os
          if not os.environ.get('NFL_EDGE_DATABASE_URL'):
              print('NFL_EDGE_DATABASE_URL is missing. Add it under GitHub Settings > Secrets and variables > Actions.')
              raise SystemExit(1)
          has_key = bool(os.environ.get('THE_ODDS_API_KEY'))
          print('THE_ODDS_API_KEY present' if has_key else 'THE_ODDS_API_KEY missing: live collection disabled; dry-run only')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as fh:
              fh.write(f"has_odds_key={'true' if has_key else 'false'}\n")
          EOF
      - name: Apply additive migrations
        env:
          NFL_EDGE_DATABASE_URL: ${{ secrets.NFL_EDGE_DATABASE_URL }}
        run: python ops/migrate.py
      - name: Check weekly credit ceiling
        id: weeklycap
        env:
          NFL_EDGE_DATABASE_URL: ${{ secrets.NFL_EDGE_DATABASE_URL }}
        run: |
          python3 - <<'EOF'
          # Hard weekly ceiling: 576 credits (user-authorized 2026-09-16).
          # Week = Monday 00:00 ET .. Sunday 23:59:59 ET. Tripwire at 480
          # leaves headroom for one maxed per-run cap (90): 480 + 90 = 570 < 576.
          # Fail-closed: a DB error fails the run rather than spending blind.
          import os, datetime
          from zoneinfo import ZoneInfo
          import psycopg
          ET = ZoneInfo("America/New_York")
          now_et = datetime.datetime.now(ET)
          week_start = (now_et - datetime.timedelta(days=now_et.weekday())).replace(
              hour=0, minute=0, second=0, microsecond=0)
          with psycopg.connect(os.environ["NFL_EDGE_DATABASE_URL"]) as conn:
              spent = conn.execute(
                  "SELECT COALESCE(SUM(credits_consumed), 0) "
                  "FROM public.nfl_prop_collection_attempts "
                  "WHERE attempted_at >= %s",
                  (week_start,)).fetchone()[0]
          over = spent >= 480
          print(f"week_start_et={week_start.isoformat()} spent={spent} over_cap={over}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"over_cap={'true' if over else 'false'}\n")
              fh.write(f"week_spent={spent}\n")
          EOF
      - name: Dry-run prop collection cycle
        if: ${{ inputs.live != true && !(github.event_name == 'schedule' && vars.NFL_PROP_LIVE_OK == '1') }}
        env:
          NFL_EDGE_DATABASE_URL: ${{ secrets.NFL_EDGE_DATABASE_URL }}
        run: |
          python ops/nfl_prop_collect.py \
            --fixture-events ops/fixtures/nfl_prop_events_fixture.json \
            --simulate-odds ops/fixtures/nfl_prop_simulate_odds.json \
            --out /tmp/nfl_prop_dryrun.json
      - name: Upload dry-run artifact
        if: ${{ inputs.live != true && !(github.event_name == 'schedule' && vars.NFL_PROP_LIVE_OK == '1') }}
        uses: actions/upload-artifact@v4
        with:
          name: nfl-prop-dryrun-${{ github.run_number }}
          path: /tmp/nfl_prop_dryrun.json
      - name: Live prop collection (requires NFL_PROP_LIVE_OK=1)
        if: ${{ (inputs.live == true || (github.event_name == 'schedule' && vars.NFL_PROP_LIVE_OK == '1')) && steps.weeklycap.outputs.over_cap != 'true' }}
        env:
          NFL_EDGE_DATABASE_URL: ${{ secrets.NFL_EDGE_DATABASE_URL }}
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
          NFL_PROP_LIVE_OK: ${{ vars.NFL_PROP_LIVE_OK }}
        run: |
          python ops/nfl_prop_collect.py --live --run-id "prop-${{ github.run_number }}-${{ github.run_attempt }}"
