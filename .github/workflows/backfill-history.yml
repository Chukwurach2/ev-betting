name: NFL Edge historical odds backfill
on:
  workflow_dispatch:
    inputs:
      seasons:
        description: 'Comma-separated seasons (2022+ only)'
        required: false
        default: '2022,2023,2024'
      weeks:
        description: 'Week range, e.g. 1-18'
        required: false
        default: '1-18'
      regions:
        description: 'Odds API regions (eu carries Pinnacle)'
        required: false
        default: 'us,eu'
      max_credits:
        description: 'Stop after spending this many credits'
        required: false
        default: '15000'
permissions:
  contents: read
concurrency:
  group: nfl-edge-backfill-history
  cancel-in-progress: false
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: nfl-edge
    steps:
      - name: Read NFL Edge source without resolving unrelated submodules
        working-directory: .
        env:
          GH_READ_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'BOOTSTRAP'
          import io, os, pathlib, tarfile, urllib.request
          url = 'https://api.github.com/repos/' + os.environ['GITHUB_REPOSITORY'] + '/tarball/' + os.environ['GITHUB_SHA']
          request = urllib.request.Request(url, headers={'Authorization': 'Bearer ' + os.environ['GH_READ_TOKEN'], 'Accept': 'application/vnd.github+json'})
          with urllib.request.urlopen(request, timeout=60) as response:
              data = response.read()
          count = 0
          with tarfile.open(fileobj=io.BytesIO(data), mode='r:gz') as archive:
              for member in archive:
                  relative = pathlib.PurePosixPath(*pathlib.PurePosixPath(member.name).parts[1:])
                  if not member.isfile() or not relative.parts or relative.parts[0] != 'nfl-edge':
                      continue
                  if '..' in relative.parts or relative.is_absolute():
                      raise ValueError('Unsafe archive member')
                  target = pathlib.Path(str(relative))
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(archive.extractfile(member).read())
                  count += 1
          if not count:
              raise ValueError('NFL Edge source missing')
          print('Loaded', count, 'NFL Edge source files from the exact workflow commit')
          BOOTSTRAP
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r ops/requirements.txt
      - name: Verify backfill secrets
        env:
          NFL_EDGE_DATABASE_URL: <redacted>
          THE_ODDS_API_KEY: <redacted>
        run: |
          python3 - <<'EOF'
          import os
          if not os.environ.get('NFL_EDGE_DATABASE_URL'):
              print('NFL_EDGE_DATABASE_URL is missing. Add it under GitHub Settings > Secrets and variables > Actions.')
              raise SystemExit(1)
          if not os.environ.get('THE_ODDS_API_KEY'):
              print('THE_ODDS_API_KEY is missing. Add it under GitHub Settings > Secrets and variables > Actions.')
              raise SystemExit(1)
          print('Backfill secrets present')
          EOF
      - name: Apply additive migrations
        env:
          NFL_EDGE_DATABASE_URL: <redacted>
        run: python ops/migrate.py
      - name: Historical backfill
        env:
          NFL_EDGE_DATABASE_URL: <redacted>
          THE_ODDS_API_KEY: <redacted>
        run: |
          python ops/backfill_history.py \
            --seasons "${{ inputs.seasons }}" \
            --weeks "${{ inputs.weeks }}" \
            --regions "${{ inputs.regions }}" \
            --max-credits "${{ inputs.max_credits }}"
