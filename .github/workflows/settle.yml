name: NFL Edge daily settlement
on:
  schedule:
    # Once daily at 06:00 UTC, after the Monday night game finishes. One
    # scores request covers the recent slate; results and CLV are computed
    # for shadow picks only.
    - cron: '0 6 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nfl-edge-settle
  cancel-in-progress: false
jobs:
  settle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: nfl-edge
    steps:
      - name: Read NFL Edge source without resolving unrelated submodules
        working-directory: .
        env:
          GH_READ_TOKEN: ${{ secrets.GH_READ_TOKEN }}
        run: |
          python3 - <<'BOOTSTRAP'
          import io, os, pathlib, tarfile, urllib.request
          url = 'https://api.github.com/repos/' + os.environ['GITHUB_REPOSITORY'] + '/tarball/' + os.environ['GITHUB_SHA']
          request = urllib.request.Request(url, headers={'Authorization': 'Bearer ' + os.environ['GH_READ_TOKEN'], 'Accept': 'application/vnd.github+json'})
          with urllib.request.urlopen(request, timeout=60) as response:
              data = response.read()
          count = 0
          with tarfile.open(fileobj=io.BytesIO(data), mode='r:gz') as archive:
              for member in archive:
                  relative = pathlib.PurePosixPath(*pathlib.PurePosixPath(member.name).parts[1:])
                  if not member.isfile() or not relative.parts or relative.parts[0] != 'nfl-edge':
                      continue
                  if '..' in relative.parts or relative.is_absolute():
                      raise ValueError('Unsafe archive member')
                  target = pathlib.Path(str(relative))
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(archive.extractfile(member).read())
                  count += 1
          if not count:
              raise ValueError('NFL Edge source missing')
          print('Loaded', count, 'NFL Edge source files from the exact workflow commit')
          BOOTSTRAP
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r ops/requirements.txt
      - name: Verify settlement secrets
        env:
          NFL_EDGE_DATABASE_URL: ${{ secrets.NFL_EDGE_DATABASE_URL }}
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
        run: |
          python3 - <<'EOF'
          import os
          missing = [k for k in ('NFL_EDGE_DATABASE_URL', 'THE_ODDS_API_KEY') if not os.environ.get(k)]
          if missing:
              print('Missing required secrets:', ', '.join(missing))
              raise SystemExit(1)
          print('Settlement secrets present')
          EOF
      - name: Apply additive migrations
        env:
          NFL_EDGE_DATABASE_URL: ${{ secrets.NFL_EDGE_DATABASE_URL }}
        run: python ops/migrate.py
      - name: Settle shadow picks and compute CLV
        env:
          NFL_EDGE_DATABASE_URL: ${{ secrets.NFL_EDGE_DATABASE_URL }}
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
        run: python ops/settle.py
      - name: Verify settlement state
        env:
          NFL_EDGE_DATABASE_URL: ${{ secrets.NFL_EDGE_DATABASE_URL }}
        run: |
          python3 - <<'EOF'
          import os, psycopg
          conn = psycopg.connect(os.environ["NFL_EDGE_DATABASE_URL"])
          cur = conn.cursor()
          cur.execute("""SELECT result, count(*), round(avg(edge),4), round(avg(clv_prob_points),4)
                         FROM public.nfl_edge_picks GROUP BY 1 ORDER BY 1""")
          print("picks by result (count, avg edge, avg CLV pp):", cur.fetchall())
          cur.execute("""SELECT count(*) FROM public.nfl_edge_picks WHERE result IS NULL""")
          print("unsettled picks:", cur.fetchone()[0])
          conn.close()
          EOF
