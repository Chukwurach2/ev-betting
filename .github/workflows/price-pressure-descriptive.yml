name: price-pressure-descriptive

on:
  workflow_dispatch:
    inputs:
      sport:
        description: "Sport key"
        required: false
        default: "ncaaf"
      seasons:
        description: "Comma-separated seasons (2025 must stay sealed)"
        required: false
        default: "2022,2023,2024"

jobs:
  descriptive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          sparse-checkout: nfl-edge
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r nfl-edge/ops/requirements.txt
      - name: Run price-pressure descriptive (read-only, zero credits)
        env:
          NFL_EDGE_DATABASE_URL: ${{ secrets.NFL_EDGE_DATABASE_URL }}
        run: |
          python nfl-edge/ops/price_pressure_descriptive.py \
            --sport "${{ inputs.sport }}" \
            --seasons "${{ inputs.seasons }}" \
            --out /tmp/price_pressure_descriptive.json
      - name: Upload descriptive artifact
        uses: actions/upload-artifact@v4
        with:
          name: price-pressure-descriptive
          path: /tmp/price_pressure_descriptive.json
