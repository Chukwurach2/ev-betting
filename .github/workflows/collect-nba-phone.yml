name: NBA bounded phone quote collection
on:
  workflow_dispatch:
    inputs:
      confirm_quota_use:
        description: 'Allow one NBA spreads/totals request (up to 2 existing provider credits)'
        type: boolean
        required: true
        default: false
permissions:
  contents: read
concurrency:
  group: nba-phone-collection
  cancel-in-progress: false
jobs:
  collect:
    if: github.ref == 'refs/heads/main' && inputs.confirm_quota_use == true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: nfl-edge
    steps:
      - name: Read NFL Edge source without resolving unrelated submodules
        working-directory: .
        env:
          GH_READ_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'BOOTSTRAP'
          import io, os, pathlib, tarfile, urllib.request
          url = 'https://api.github.com/repos/' + os.environ['GITHUB_REPOSITORY'] + '/tarball/' + os.environ['GITHUB_SHA']
          request = urllib.request.Request(url, headers={'Authorization': 'Bearer ' + os.environ['GH_READ_TOKEN'], 'Accept': 'application/vnd.github+json'})
          with urllib.request.urlopen(request, timeout=60) as response:
              data = response.read()
          count = 0
          with tarfile.open(fileobj=io.BytesIO(data), mode='r:gz') as archive:
              for member in archive:
                  relative = pathlib.PurePosixPath(*pathlib.PurePosixPath(member.name).parts[1:])
                  if not member.isfile() or not relative.parts or relative.parts[0] != 'nfl-edge':
                      continue
                  if '..' in relative.parts or relative.is_absolute():
                      raise ValueError('Unsafe archive member')
                  target = pathlib.Path(str(relative))
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(archive.extractfile(member).read())
                  count += 1
          if not count:
              raise ValueError('NFL Edge source missing')
          print('Loaded', count, 'NFL Edge source files from the exact workflow commit')
          BOOTSTRAP
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install runtime dependencies
        run: npm install --ignore-scripts --no-package-lock
      - name: Verify collector logic without provider calls
        run: node --test tests/nba-collection.test.mjs tests/nba-feed.test.mjs
      - name: Capture one bounded NBA snapshot
        env:
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
          NFL_EDGE_DATABASE_URL: ${{ secrets.NFL_EDGE_DATABASE_URL }}
        run: node ops/collect-nba.mjs --confirm-quota-use
      - name: Check actual phone delivery
        run: |
          node --input-type=module <<'JS'
          const response=await fetch('https://nfl-edge-v2-1.vercel.app/api/game-cards?sport=nba',{signal:AbortSignal.timeout(20000)});
          if(!response.ok)throw Error('Phone feed unavailable after collection');
          const d=await response.json();
          if(d.sport!=='nba'||!Array.isArray(d.games))throw Error('Unexpected phone feed');
          const now=Date.now();
          const current=d.games.flatMap(g=>g.picks||[]).filter(p=>Date.parse(p.observed_at)<=now&&now-Date.parse(p.observed_at)<=900000&&(!p.expires_at||Date.parse(p.expires_at)>now));
          console.log(JSON.stringify({mode:'paper',games:d.games.length,current_leans:current.length,delivery:current.length?'fresh_cards_returned':'no_supported_fresh_cards',note:'Successful collection alone does not imply a qualifying lean.'}));
          JS
